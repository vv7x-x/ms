<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الاقتناء - ريشة الكريستال</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=1.1">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="site-wrapper">
        <header class="main-header">
            <div class="logo-container" onclick="window.location.href='index.html'">
                <img src="assets/logo.png" alt="Logo" class="site-logo">
                <div class="logo-text">
                    <h1>ريشة الكريستال</h1>
                    <p>إتمام الاقتناء</p>
                </div>
            </div>
        </header>

        <main class="exhibition-container" style="padding-top: 150px;">
            <div class="dashboard-container" data-aos="fade-up" style="max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 40px;">
                <!-- Payment Form -->
                <section class="book-card" style="padding: 40px; cursor: default;">
                    <h3 class="title-serif" style="color: var(--gold-main); margin-bottom: 30px;">بيانات المحفظة</h3>
                    <form id="paymentForm">
                        <div class="form-group" style="margin-bottom: 20px;">
                            <label>رقم البطاقة الائتمانية</label>
                            <input type="text" placeholder="**** **** **** ****" style="width:100%; padding: 12px; background:rgba(0,0,0,0.4); border:1px solid var(--glass-border); color:#fff; border-radius:8px;">
                        </div>
                        <div style="display: flex; gap: 20px; margin-bottom: 20px;">
                            <div class="form-group">
                                <label>تاريخ الانتهاء</label>
                                <input type="text" placeholder="MM/YY" style="width:100%; padding: 12px; background:rgba(0,0,0,0.4); border:1px solid var(--glass-border); color:#fff; border-radius:8px;">
                            </div>
                            <div class="form-group">
                                <label>CVC</label>
                                <input type="text" placeholder="***" style="width:100%; padding: 12px; background:rgba(0,0,0,0.4); border:1px solid var(--glass-border); color:#fff; border-radius:8px;">
                            </div>
                        </div>
                        <button type="submit" class="btn-primary" style="margin-top: 20px;">تأكيد الدفع والاقتناء</button>
                    </form>
                </section>

                <!-- Order Summary -->
                <section style="background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); padding: 40px; border-radius: 15px;">
                    <h3 class="title-serif" style="color: var(--gold-main); margin-bottom: 30px;">ملخص المقتنيات</h3>
                    <div id="checkoutSummaryBody">
                        <!-- Summary items -->
                    </div>
                    <div style="margin-top: 30px; border-top: 1px dashed var(--glass-border); padding-top: 20px;">
                        <h4 style="display: flex; justify-content: space-between; color: #fff;">المجموع: <span id="checkoutTotal" style="color: var(--gold-main);">0</span> ر.س</h4>
                    </div>
                </section>
            </div>
        </main>

        <footer>
            <div class="footer-grid">
                <div class="footer-section"><h4>بوابة الدفع الكريستالية</h4><p>تشفير وآمان لضمان سلامة مقتنياتك الأدبية.</p></div>
                <div class="footer-section"><div class="orb-pedestal"><img src="assets/books.png" class="orb-book"></div></div>
            </div>
        </footer>
    </div>

    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script src="js/common.js"></script>
    <script>
        AOS.init();
        
        function loadSummary() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const summaryBody = document.getElementById('checkoutSummaryBody');
            const totalEl = document.getElementById('checkoutTotal');
            
            if (cart.length === 0) return window.location.href = 'index.html';

            let total = 0;
            summaryBody.innerHTML = cart.map(item => {
                total += item.price;
                return `<p style="display: flex; justify-content: space-between; margin-bottom: 10px; color: var(--text-muted);"><span>${item.title}</span> <span>${item.price} ر.س</span></p>`;
            }).join('');
            
            totalEl.innerText = total;
        }

        document.getElementById('paymentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = await checkAuth();
            if (user.error) return showToast('يرجى تسجيل الدخول أولاً لإتمام العملية', 'error');

            showToast('جاري تأكيد المقتنيات... برجاء عدم إغلاق الصفحة');
            
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            
            // Simulation: Record each book in user_library
            for (let book of cart) {
                await fetch('/api/library/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bookId: book.id, type: 'purchase' })
                });
            }

            localStorage.removeItem('cart');
            showToast('تمت عملية الاقتناء بنجاح! تم نقل المجلدات لمكتبتك الخاصة');
            setTimeout(() => window.location.href = 'profile.html', 2000);
        });

        loadSummary();
    </script>
</body>
</html>
