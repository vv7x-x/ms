<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تسجيل دخول المشرف</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-login { max-width:420px; margin:140px auto; background:rgba(0,0,0,0.6); padding:24px; border-radius:12px; border:1px solid rgba(212,175,55,0.12); }
    .admin-login h2 { color:var(--gold-main); font-family:var(--font-serif); margin-bottom:12px; }
    .admin-login input { width:100%; padding:12px; margin-bottom:12px; border-radius:8px; border:1px solid rgba(255,255,255,0.06); background:transparent; color:var(--text-parchment); }
    .admin-login button { width:100%; padding:12px; background:var(--gold-main); border:none; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div class="admin-login">
    <h2>لوحة المشرف — تسجيل الدخول</h2>
    <input id="adminPass" type="password" placeholder="أدخل كلمة المرور" aria-label="كلمة مرور المشرف">
    <button id="loginBtn">تسجيل الدخول</button>
    <p id="msg" style="color:var(--text-muted); margin-top:12px;"></p>
  </div>

  <script>
    document.getElementById('loginBtn').addEventListener('click', async () => {
      const pass = document.getElementById('adminPass').value;
      const res = await fetch('/admin/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ password: pass }) });
      const data = await res.json();
      if (res.ok) { window.location.href = '/admin.html'; }
      else { document.getElementById('msg').innerText = data.error || 'فشل تسجيل الدخول'; }
    });
  </script>
</body>
</html>
